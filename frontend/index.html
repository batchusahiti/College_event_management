<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College Event Management</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f3f4f6;
            color: #222;
        }

        header {
            background: #263b80;
            color: white;
            padding: 24px;
            text-align: center;
        }

        main {
            max-width: 800px;
            margin: 30px auto;
            padding: 20px;
        }

        .event, #registration {
            background: white;
            padding: 20px;
            margin-bottom: 16px;
            border-radius: 10px;
            box-shadow: 0 2px 8px #0001;
        }

        button {
            background: #263b80;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            cursor: pointer;
        }

        input, select {
            display: block;
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            margin: 10px 0 16px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        #registration {
            display: none;
        }

        #message {
            color: green;
            font-weight: bold;
        }
    </style>
</head>
<body>

<header>
    <h1>College Event Management</h1>
    <p>Discover events. Participate. Make memories!</p>
</header>

<main>
    <h2>Upcoming Events</h2>

    <div class="event">
        <h3>Tech Fest 2026</h3>
        <p>Explore technology, coding and innovation.</p>
        <button onclick="openForm('Tech Fest 2026')">Register</button>
    </div>

    <div class="event">
        <h3>Cultural Fest 2026</h3>
        <p>Enjoy music, dance and cultural activities.</p>
        <button onclick="openForm('Cultural Fest 2026')">Register</button>
    </div>

    <section id="registration">
        <h2>Event Registration</h2>

        <form id="registrationForm">
            <label for="eventName">Selected Event</label>
            <input id="eventName" name="eventName" readonly>

            <label for="studentName">Student Name</label>
            <input id="studentName" name="studentName"
                   required placeholder="Enter your full name">

            <label for="email">Email Address</label>
            <input id="email" name="email" type="email"
                   required placeholder="Enter your email">

            <label for="rollNumber">Roll Number</label>
            <input id="rollNumber" name="rollNumber"
                   required placeholder="Enter your roll number">

            <button type="submit">Submit Registration</button>
        </form>

        <p id="message" role="status"></p>
    </section>
</main>

<script>
    function openForm(event) {
        document.getElementById("registration").style.display = "block";
        document.getElementById("eventName").value = event;
        document.getElementById("message").textContent = "";
        document.getElementById("registration").scrollIntoView({
            behavior: "smooth"
        });
    }

    document.getElementById("registrationForm")
        .addEventListener("submit", function(e) {
            e.preventDefault();

            const name = document.getElementById("studentName").value;

            document.getElementById("message").textContent =
                "Thank you, " + name +
                "! Your registration form was submitted successfully.";

            this.reset();
            document.getElementById("registration").style.display = "block";
        });
</script>

</body>
</html>
